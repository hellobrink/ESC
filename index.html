<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Education Scalability Conversations</title>

<!-- Empty data URI: stops the browser making a request for a favicon.
     Zero external requests is a hard requirement. -->
<link rel="icon" href="data:,">

<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>

<body class="app">

<a class="skip-link" href="#main">Skip to the main content</a>

<!-- =========================================================================
     LOGO BAR — top of every screen and every printed page.
     Two empty slots. Drop the artwork straight in; nothing else needs changing.
     HIDDEN FOR NOW by a rule at the end of css/layout.css and css/print.css.
     ====================================================================== -->
<div class="logo-bar-wrapper">
  <div class="l-container">
    <div class="logo-bar">
      <div class="logo-bar__slot logo-bar__slot--start" data-logo="global-gateway">
        <!-- Global Gateway logo goes here -->
      </div>
      <div class="logo-bar__slot logo-bar__slot--end" data-logo="eu">
        <!-- European Union logo goes here -->
      </div>
    </div>
  </div>
</div>

<!-- =========================================================================
     HEADER — on every screen, sticky on wider screens. The tool's identity
     and two light utilities. Review & Export is not here: it belongs with
     the work, in the bar below and at the foot of a conversation.
     Every id here is wired up in js/app.js.
     ====================================================================== -->
<header class="site-header">

  <div class="l-container">
    <div class="site-header__row">

      <!-- Appears once someone is past Welcome; see renderBack() in js/app.js. -->
      <p class="site-header__back" id="site-header-back" hidden>
        <a class="nav__button nav__button--back" id="nav-back" href="#/"></a>
      </p>

      <p class="site-header__brand">
        <a class="site-header__brand-link" id="masthead-brand" href="#/"></a>
        <!-- Informational only: not a link, not a control. -->
        <span class="site-header__beta" id="masthead-beta"></span>
      </p>

      <nav class="site-header__nav nav" aria-label="Tool actions">
        <ul class="nav__list">
          <!-- Load: the input stays in the document and in the tab order;
               only the label is seen. Input first, so the label can show
               its focus. -->
          <li class="nav__item nav__item--load">
            <input class="nav__load-input" type="file" id="load-progress"
                   accept=".json,application/json">
            <label class="nav__load-label" id="load-progress-label" for="load-progress"></label>
          </li>
          <!-- Destructive. Asks before it wipes anything; see wireProgressControls(). -->
          <li class="nav__item"><button type="button" class="nav__button nav__button--reset" id="reset-progress"></button></li>
        </ul>
      </nav>

    </div>
  </div>

  <!-- The working bar: where the work is held, and the two things anyone
       needs to hand while working. data-status on the status line is the
       styling hook: empty | stored-only | no-storage | downloaded | error -->
  <div class="progress-band">
    <div class="l-container">
      <div class="progress">

        <div class="progress__state">
          <p class="progress__title" id="progress-title"></p>
          <p class="progress__status" id="save-status" data-status="empty"
             role="status" aria-live="polite"></p>
        </div>

        <div class="progress__actions">
          <div class="progress__save-group">
            <button type="button" class="progress__save" id="save-progress"></button>
            <p class="progress__help" id="save-help"></p>
          </div>
          <a class="progress__review" id="progress-review" href="#/review"></a>
        </div>

      </div>

      <!-- Confirmation after a copy downloads. Announced, then fades from the
           flow on its own: nothing to dismiss. -->
      <p class="progress__confirm" id="save-confirm" role="status" aria-live="polite" hidden></p>

    </div>
  </div>

</header>

<!-- =========================================================================
     MAIN — one section per screen. Exactly one is visible at a time; the rest
     carry the hidden attribute.
     ====================================================================== -->
<main class="app__main" id="main">
  <div class="l-container">

    <!-- ---------------------------------------------------------------------
         Shown only if content/modules.js failed to load.
         ------------------------------------------------------------------ -->
    <div class="notice" id="content-error" hidden></div>

    <!-- ---------------------------------------------------------------------
         1. WELCOME — the introduction, the test notice, and two ways on.
         ------------------------------------------------------------------ -->
    <section class="screen screen--welcome welcome" id="screen-welcome" aria-labelledby="welcome-title" hidden>
      <h1 class="screen__title" id="welcome-title" tabindex="-1"></h1>
      <div class="welcome__body" id="welcome-body"></div>
      <div class="welcome__actions">
        <!-- Leaves the tool, so it opens in a new tab. The address lives in
             content/modules.js as meta.canvasUrl. -->
        <a class="welcome__canvas" id="welcome-canvas" href="#" target="_blank" rel="noopener noreferrer"></a>
        <a class="welcome__cta" id="welcome-cta" href="#/how"></a>
      </div>
    </section>

    <!-- ---------------------------------------------------------------------
         2. HOW TO USE THIS TOOL — the six instructions as numbered cards.
         Informational only: nothing here is clickable.
         ------------------------------------------------------------------ -->
    <section class="screen screen--how how" id="screen-how" aria-labelledby="how-title" hidden>
      <h1 class="screen__title" id="how-title" tabindex="-1"></h1>
      <p class="how__intro" id="how-intro"></p>
      <p class="how__guidelines"><a class="how__guidelines-link" id="how-guidelines" href="#/guidelines"></a></p>
      <ol class="how__steps" id="how-steps"></ol>
      <div class="how__actions">
        <a class="how__cta" id="how-cta" href="#/modules"></a>
      </div>
    </section>

    <!-- ---------------------------------------------------------------------
         GUIDELINES — the fuller guidance, on its own page.
         ------------------------------------------------------------------ -->
    <section class="screen screen--guidelines guidelines" id="screen-guidelines" aria-labelledby="guidelines-title" hidden>
      <h1 class="screen__title" id="guidelines-title" tabindex="-1"></h1>
      <p class="guidelines__intro" id="guidelines-intro"></p>
      <div class="guidelines__body" id="guidelines-body"></div>
    </section>

    <!-- ---------------------------------------------------------------------
         3 + 4. CHOOSE A MODULE, then the conversation.
         One screen, two states. With no module chosen the picker is a grid of
         seven large cards; choosing one condenses it to a compact row and the
         conversation appears underneath. Same section throughout, so it reads
         as the cards collapsing rather than a new page.
         ------------------------------------------------------------------ -->
    <section class="screen screen--module" id="screen-module" aria-labelledby="module-title" hidden>
      <h1 class="screen__title" id="module-title" tabindex="-1"></h1>
      <p class="module-list__intro" id="module-intro"></p>
      <!-- The seven modules. The same grid throughout: choosing one collapses
           the cards in place and the conversation opens underneath. -->
      <div id="module-picker"></div>
      <div id="module-body"></div>
    </section>

    <!-- ---------------------------------------------------------------------
         REVIEW — everything typed across all modules, plus the export options.
         In test builds, also the "send to the team" block.
         ------------------------------------------------------------------ -->
    <section class="screen screen--review" id="screen-review" aria-labelledby="review-title" hidden>
      <h1 class="screen__title" id="review-title" tabindex="-1"></h1>
      <p class="review__intro" id="review-intro"></p>
      <div id="review-body"></div>
    </section>

  </div>
</main>

<!-- =========================================================================
     FOOTER — on every screen and every printed page.

     The European Union funding statement below is a funding requirement and
     must appear verbatim. It is written here, not in content/modules.js, so
     that a content edit cannot change or remove it by accident. Do not move it.
     ====================================================================== -->
<footer class="site-footer">
  <div class="l-container">

    <p class="site-footer__funding">This publication was funded by the European Union. Its contents are the sole responsibility of the author and do not necessarily reflect the views of the European Union.</p>

    <!-- Attribution block. Content-driven from content/modules.js. -->
    <section class="site-footer__attribution attribution" aria-labelledby="attribution-title">
      <h2 class="attribution__title" id="attribution-title"></h2>
      <dl class="attribution__list" id="attribution-list"></dl>
    </section>

  </div>
</footer>

<!-- =========================================================================
     SCRIPTS — plain scripts, loaded in dependency order. No modules, no
     bundler, no fetch: this all has to work from file://
     ====================================================================== -->
<script src="config.js"></script>
<script src="content/modules.js"></script>
<script src="js/state.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>

</body>
</html>
